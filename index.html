<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FurryLand Message Tracker</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--text:#f0f6fc;--muted:#8b949e;--line:#30363d;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--orange:#db6d28;--red:#f85149;--purple:#a371f7}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.brand h1{margin:0;font-size:30px}.brand p{color:var(--muted);margin:6px 0 0}.tabs{display:flex;gap:8px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 18px;border-radius:9px;cursor:pointer;font-weight:700}.tab.active{background:var(--accent);color:#07111f;border-color:var(--accent)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.toolbar input{flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:9px}.summary{margin-left:auto;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.card{background:var(--panel);border:2px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 6px 20px rgba(0,0,0,.14);transition:border-color .25s,box-shadow .25s}.card.fresh{border-color:var(--green);box-shadow:0 0 0 1px rgba(63,185,80,.15),0 6px 20px rgba(0,0,0,.14)}.card.warn{border-color:var(--yellow)}.card.stale{border-color:var(--orange)}.card.overdue{border-color:var(--red)}.checkdot{width:11px;height:11px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:7px;box-shadow:0 0 0 3px rgba(139,148,158,.12)}.fresh .checkdot{background:var(--green)}.warn .checkdot{background:var(--yellow)}.stale .checkdot{background:var(--orange)}.overdue .checkdot{background:var(--red)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.card h2{font-size:18px;margin:0}.elapsed{font-size:12px;color:var(--muted);white-space:nowrap}.time{font-size:14px;color:#c9d1d9;margin:11px 0 14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status,.comments{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px}.comments{grid-column:1/-1;min-height:68px;resize:vertical}.btn{border:0;border-radius:8px;padding:11px 10px;font-weight:800;cursor:pointer}.markall{background:var(--green);color:#061108;white-space:nowrap}.savehint{grid-column:1/-1;min-height:16px;font-size:11px;color:var(--muted);margin-top:-5px}.checked{background:var(--green);color:#061108}.open{background:var(--accent);color:#07111f}.status.waiting{border-color:var(--yellow);box-shadow:inset 4px 0 var(--yellow)}.status.offered{border-color:var(--green);box-shadow:inset 4px 0 var(--green)}.status.busy{border-color:var(--red);box-shadow:inset 4px 0 var(--red)}.status.followup{border-color:var(--purple);box-shadow:inset 4px 0 var(--purple)}.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}.hidden{display:none!important}@media(max-width:650px){.wrap{padding:16px}.top{align-items:flex-start;flex-direction:column}.toolbar{flex-wrap:wrap}.summary{margin-left:0;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand"><h1>🐾 FurryLand Message Tracker</h1><p>Message checks, statuses, and notes in one place.</p></div><div class="tabs"><button class="tab active" data-team="usa">🇺🇸 Team USA</button><button class="tab" data-team="canada">🇨🇦 Team Canada</button></div></div>
<div class="toolbar"><input id="search" placeholder="Search locations…"><button class="btn markall" id="markAll">✓ MARK ALL CHECKED</button><div class="summary" id="summary"></div></div>
<div class="grid" id="grid"></div><div class="foot"><span id="syncStatus">Connecting to shared tracker…</span></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDixbzJzSbpVFR1nck1IaMzPeLR5-B1QQs",
  authDomain: "data-base-for-message-tracking.firebaseapp.com",
  databaseURL: "https://data-base-for-message-tracking-default-rtdb.firebaseio.com",
  projectId: "data-base-for-message-tracking",
  storageBucket: "data-base-for-message-tracking.firebasestorage.app",
  messagingSenderId: "130006194977",
  appId: "1:130006194977:web:4f749c5c922fefbbf7bc60",
  measurementId: "G-QWQC8RHXPT"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const USA=["AUGUSTA","BATON","BOSTON","CENTRAL NJ","COLORADO SPRINGS","CORPUS","DENVER","GREENSBORO","HARRISBURG","HUNTSVILLE","KANSAS","NORTHERN COLORADO","NASHVILLE","PHOENIX","SAN ANTONIO","SAVANNAH","SHERMAN","VERMONT","MADISON","RALEIGH"];
const CANADA=[];
const USA_URLS={"AUGUSTA":"https://go.moego.pet/calendar/grooming?%7Ec=117274&%7Eb=117686","BATON":"https://go.moego.pet/calendar/grooming?%7Ec=117003&%7Eb=110205","BOSTON":"https://go.moego.pet/calendar/grooming?%7Ec=117022&%7Eb=113325","CENTRAL NJ":"https://go.moego.pet/calendar/grooming?%7Ec=117027&%7Eb=113563","COLORADO SPRINGS":"https://go.moego.pet/calendar/grooming?%7Ec=116980&%7Eb=106500","CORPUS":"https://go.moego.pet/calendar/grooming?%7Ec=116995&%7Eb=108916","DENVER":"https://go.moego.pet/calendar/grooming?%7Ec=117014&%7Eb=112038","GREENSBORO":"https://go.moego.pet/calendar/grooming?%7Ec=117001&%7Eb=110202","HARRISBURG":"https://go.moego.pet/calendar/grooming?%7Ec=117021&%7Eb=112045","HUNTSVILLE":"https://go.moego.pet/calendar/grooming?%7Ec=117028&%7Eb=113564","KANSAS":"https://go.moego.pet/calendar/grooming?%7Ec=117035&%7Eb=115729","NORTHERN COLORADO":"https://go.moego.pet/calendar/grooming?%7Ec=129136&%7Eb=130004","NASHVILLE":"https://go.moego.pet/calendar/grooming?%7Ec=116988&%7Eb=108909","PHOENIX":"https://go.moego.pet/calendar/grooming?%7Ec=116973&%7Eb=105808","SAN ANTONIO":"https://go.moego.pet/calendar/grooming?%7Ec=116998&%7Eb=108919","SAVANNAH":"https://go.moego.pet/calendar/grooming?%7Ec=117007&%7Eb=110209","SHERMAN":"https://go.moego.pet/calendar/grooming?%7Ec=119482&%7Eb=119818","VERMONT":"https://go.moego.pet/calendar/grooming?%7Ec=117030&%7Eb=115063","MADISON":"https://go.moego.pet/calendar/grooming?%7Ec=117020&%7Eb=112044","RALEIGH":"https://go.moego.pet/calendar/grooming?%7Ec=116997&%7Eb=108918"};

let team='usa';
let data={usa:{},canada:{}};
const syncStatus=document.querySelector('#syncStatus');
const timers={};
function firebaseKey(loc){return loc.replace(/[.#$\[\]\/]/g,'_')}
function ensure(loc){if(!data[team])data[team]={};if(!data[team][loc])data[team][loc]={status:'',checked:null,comment:''};return data[team][loc]}
function statusClass(v){return v==='Waiting for Reply'?'waiting':v==='Offered Avail'?'offered':v==='Busy'?'busy':v==='Needs Follow-Up'?'followup':''}
function elapsed(ts){if(!ts)return 'Never checked';let s=Math.max(0,Math.floor((Date.now()-ts)/1000));if(s<60)return 'Just now';let m=Math.floor(s/60);if(m<60)return m+'m ago';let h=Math.floor(m/60);if(h<24)return h+'h '+(m%60)+'m ago';return Math.floor(h/24)+'d ago'}
function formatted(ts){return ts?new Date(ts).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'Not checked yet'}
function ageClass(ts){if(!ts)return '';const m=(Date.now()-ts)/60000;if(m<1)return 'fresh';if(m<8)return 'warn';if(m<18)return 'stale';return 'overdue'}
function locationRef(loc){return ref(db,`tracker/${team}/${firebaseKey(loc)}`)}
async function saveFields(loc,fields){syncStatus.textContent='Saving…';try{await update(locationRef(loc),fields);syncStatus.textContent='✓ Shared sync connected'}catch(err){console.error(err);syncStatus.textContent='⚠ Could not save — check Firebase database rules'}}
function render(){const list=team==='usa'?USA:CANADA;const q=document.querySelector('#search').value.toLowerCase();const grid=document.querySelector('#grid');const active=document.activeElement;const activeLoc=active?.dataset?.loc;const activeStart=active?.selectionStart;const activeEnd=active?.selectionEnd;grid.innerHTML='';let shown=0;
list.filter(x=>x.toLowerCase().includes(q)).forEach(loc=>{shown++;let d=ensure(loc);let card=document.createElement('div');card.className='card '+ageClass(d.checked);card.dataset.loc=loc;card.innerHTML=`<div class="cardhead"><h2><span class="checkdot"></span>${loc}</h2><span class="elapsed" data-ts="${d.checked||''}">${elapsed(d.checked)}</span></div><div class="time">Last checked: <strong>${formatted(d.checked)}</strong></div><div class="controls"><select class="status ${statusClass(d.status)}"><option value="">No Status</option><option>Waiting for Reply</option><option>Offered Avail</option><option>Busy</option><option>Needs Follow-Up</option></select><button class="btn checked">✓ MARK CHECKED</button><textarea class="comments" data-loc="${loc}" placeholder="Add comments / notes…"></textarea><div class="savehint"></div><button class="btn open">OPEN MESSAGES ↗</button></div>`;
let sel=card.querySelector('.status');sel.value=d.status||'';sel.onchange=e=>saveFields(loc,{status:e.target.value});let ta=card.querySelector('.comments');let hint=card.querySelector('.savehint');ta.value=d.comment||'';ta.oninput=e=>{const val=e.target.value;data[team][loc].comment=val;hint.textContent='Saving…';clearTimeout(timers[team+loc]);timers[team+loc]=setTimeout(async()=>{await saveFields(loc,{comment:val});if(document.body.contains(hint))hint.textContent='✓ Saved'},1000)};card.querySelector('.checked').onclick=()=>saveFields(loc,{checked:Date.now()});card.querySelector('.open').onclick=()=>{let url=team==='usa'?USA_URLS[loc]:null;if(url)window.open(url,'_blank','noopener');else alert('No message link has been added for '+loc+' yet.')};grid.appendChild(card)});
document.querySelector('#summary').textContent=shown+' location'+(shown===1?'':'s')+' shown';if(!list.length)grid.innerHTML='<div class="card"><h2>Canada is ready for locations</h2><p style="color:var(--muted)">Send me the Team Canada location list and I’ll add them here.</p></div>';if(activeLoc){const restored=[...document.querySelectorAll('.comments')].find(x=>x.dataset.loc===activeLoc);if(restored){restored.focus();try{restored.setSelectionRange(activeStart,activeEnd)}catch{}}}}
function tick(){document.querySelectorAll('.card').forEach(card=>{const e=card.querySelector('.elapsed');if(!e)return;let ts=Number(e.dataset.ts);e.textContent=ts?elapsed(ts):'Never checked';card.classList.remove('fresh','warn','stale','overdue');const c=ageClass(ts);if(c)card.classList.add(c)})}setInterval(tick,10000);

onValue(ref(db,'tracker'),snap=>{const raw=snap.val()||{};data={usa:{},canada:{}};for(const t of ['usa','canada']){const list=t==='usa'?USA:CANADA;for(const loc of list){const item=(raw[t]||{})[firebaseKey(loc)]||{};data[t][loc]={status:item.status||'',checked:item.checked||null,comment:item.comment||''}}}syncStatus.textContent='✓ Shared sync connected';render()},err=>{console.error(err);syncStatus.textContent='⚠ Firebase connection blocked — check database rules';render()});

document.querySelector('#markAll').onclick=async()=>{const list=team==='usa'?USA:CANADA;if(!list.length)return alert('There are no locations on this team yet.');const label=team==='usa'?'Team USA':'Team Canada';if(!confirm(`Mark all ${label} locations as checked right now?`))return;const now=Date.now();const updates={};for(const loc of list)updates[`tracker/${team}/${firebaseKey(loc)}/checked`]=now;syncStatus.textContent='Saving…';try{await update(ref(db),updates);syncStatus.textContent='✓ All locations marked checked'}catch(err){console.error(err);syncStatus.textContent='⚠ Could not save — check Firebase database rules'}};
document.querySelector('#search').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');team=b.dataset.team;render()});
render();
</script></body></html>
